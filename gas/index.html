<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ===== aming : 機械パネル風 ===== */
:root{
  --bg:#0E1215; --plate:#171D21; --plate2:#1F272C; --edge:#33414A; --edge-hi:#4C5E69;
  --ink:#DCE4E6; --sub:#8A9AA2; --steel:#9FB4BF;
  --yellow:#F5B800;--accent:#00A7B5;--accent-hi:#3FE0EA; --ok:#38E08A; --warn:#FFB020; --ng:#FF4D3D; --cyan:#3FD0FF; --stamp:#C9D6DA;
  --cut:10px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:
    linear-gradient(rgba(63,208,255,.035) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(63,208,255,.035) 1px,transparent 1px) 0 0/24px 24px,
    radial-gradient(ellipse at 50% -10%,#1C262C 0%,var(--bg) 60%);
  background-color:var(--bg);background-attachment:fixed}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,#F5B800 0 14px,#111 14px 28px);box-shadow:0 2px 0 #000}
main{max-width:720px;margin:0 auto;padding:14px 16px 16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 12px;padding:10px 12px;
  background:linear-gradient(180deg,var(--plate2),var(--plate));border:1px solid var(--edge);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));position:relative}
.brand{display:flex;align-items:center;gap:10px}
.led{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok),0 0 2px #fff inset;animation:blink 2.4s infinite}
@keyframes blink{0%,92%{opacity:1}96%{opacity:.3}}
h1{font-family:"Orbitron","Share Tech Mono",sans-serif;font-weight:800;font-size:1.45rem;letter-spacing:.18em;margin:0;line-height:1;
  background:linear-gradient(180deg,#F4F8F9 0%,#9FB4BF 55%,#5E727C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:"Share Tech Mono",monospace;font-size:.62rem;letter-spacing:.32em;color:var(--sub);margin-top:4px}
h2{font-family:"Share Tech Mono","BIZ UDPGothic",monospace;font-size:.95rem;letter-spacing:.08em;margin:0 0 10px;color:var(--steel);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:14px;background:var(--accent);box-shadow:0 0 6px rgba(0,200,215,.5)}
button{font:inherit;cursor:pointer;border:none;border-radius:0;color:inherit}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#meBtn{background:transparent;color:var(--sub);font-family:"Share Tech Mono","BIZ UDPGothic",monospace;font-size:.78rem;padding:4px 0 0;text-decoration:none;border-bottom:1px dashed var(--edge-hi)}
#today{font-family:"Share Tech Mono",monospace;font-size:1.1rem;color:var(--cyan);text-shadow:0 0 8px rgba(63,208,255,.45);
  background:#060909;border:1px solid var(--edge);padding:2px 10px;letter-spacing:.06em}
#nav{display:flex;gap:4px;margin:0 0 14px;padding:4px;background:#0A0D0F;border:1px solid var(--edge)}
#nav button{flex:1;padding:10px 0 8px;font-weight:700;font-family:"Share Tech Mono","BIZ UDPGothic",monospace;letter-spacing:.1em;
  background:linear-gradient(180deg,#232C31,#161C20);color:var(--sub);border:1px solid var(--edge);position:relative}
#nav button::after{content:"";position:absolute;left:50%;top:4px;width:18px;height:3px;margin-left:-9px;background:#2A3439}
#nav button.on{color:var(--ink);background:linear-gradient(180deg,#2C3940,#1B2328);border-color:var(--edge-hi)}
#nav button.on::after{background:var(--accent);box-shadow:0 0 8px var(--accent)}
#nav .badge{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 5px;background:var(--ng);color:#fff;font-size:.72rem;box-shadow:0 0 8px rgba(255,77,61,.6)}
section{position:relative;background:linear-gradient(180deg,var(--plate2) 0,var(--plate) 60px);border:1px solid var(--edge);padding:16px 14px 14px;margin-bottom:14px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
/* ボルト */
section::before,section::after{content:"";position:absolute;top:6px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#8FA3AD,#3A464D 60%,#1B2226);box-shadow:0 1px 0 rgba(255,255,255,.06)}
section::before{left:6px}section::after{right:16px}
.shoot{display:block;width:100%;min-height:92px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);font-size:1.15rem;font-weight:700;letter-spacing:.06em;position:relative;
  background:linear-gradient(180deg,#22C3D0,#00848F);border:none;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.shoot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:repeating-linear-gradient(-45deg,#F5B800 0 7px,#111 7px 14px)}
.shoot small{display:block;font-weight:400;font-size:.78rem;opacity:.75}
.shoot:active{transform:translateY(1px);filter:brightness(.95)}
.shoot.alt{margin-top:10px;min-height:56px;font-size:.98rem;color:var(--ink);background:linear-gradient(180deg,#2A353B,#1A2226);border:1px solid var(--edge-hi);box-shadow:none}
.shoot.alt::before{width:8px;background:var(--accent)}
.tip,.muted{font-size:.8rem;color:var(--sub)}
.tip{margin:8px 2px 16px;padding-left:10px;border-left:2px solid var(--edge-hi)}
.btn{flex:1;padding:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);background:linear-gradient(180deg,#36444B,#232D32);border:1px solid var(--edge-hi);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn:active{filter:brightness(1.15)}
.btn.sec{background:transparent;border:1px solid var(--edge-hi);color:var(--steel)}
.btn.go{background:linear-gradient(180deg,#22C3D0,#00848F);color:#fff;border:none}
.btn.ok{background:linear-gradient(180deg,#2BC274,#178A50);color:#fff;border:none;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.btn.mini{flex:0 0 auto;padding:6px 12px;font-size:.8rem}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input[type=text],input[type=number],input[type=search],textarea{width:100%;font:inherit;padding:10px;color:var(--ink);
  background:#080B0D;border:1px solid var(--edge);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border-radius:0;font-family:"Share Tech Mono","BIZ UDPGothic",monospace}
input::placeholder,textarea::placeholder{color:#55656D}
textarea{min-height:64px}
.mono{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.05em}
.plate{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--cyan);text-shadow:0 0 6px rgba(63,208,255,.4);
  background:#060909;border:1px solid var(--edge);padding:8px 12px;letter-spacing:.14em;font-size:1.3rem;overflow-x:auto}
.plate .fix{color:var(--warn);text-decoration:underline}
#preview{display:none;gap:6px;margin-bottom:10px}
#preview img{width:50%;border:1px solid var(--edge);filter:contrast(1.05)}
#status{font-family:"Share Tech Mono","BIZ UDPGothic",monospace;font-size:.88rem;color:var(--cyan);min-height:1.4em}
#status:not(:empty)::before{content:"▶ "}
.arm{display:block;width:100%;text-align:left;background:transparent;border:none;border-top:1px dashed var(--edge);padding:10px 4px;color:var(--ink)}
.arm:first-child{border-top:none}
.arm:active{background:rgba(63,208,255,.06)}
.arm.best{border:1px solid var(--ok);box-shadow:0 0 0 1px rgba(56,224,138,.25),inset 0 0 18px rgba(56,224,138,.08);padding:10px}
.az{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:1.05rem;letter-spacing:.05em;color:var(--stamp)}
.az b{margin-left:8px;font-size:1.2rem;color:#fff}
.am{display:block;font-size:.78rem;color:var(--sub)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:1px 8px;margin-left:8px;vertical-align:middle;font-family:"BIZ UDPGothic",sans-serif;letter-spacing:0;
  background:#080B0D;border:1px solid var(--edge)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.st.good{color:var(--ok)}.st.bad{color:var(--ng)}.st.todo{color:var(--warn)}
.chip{font-size:.7rem;padding:0 6px;border:1px solid currentColor;color:var(--cyan);margin-left:6px;font-family:"BIZ UDPGothic",sans-serif;letter-spacing:0}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.days button{flex:0 0 auto;padding:6px 12px;background:#0A0D0F;border:1px solid var(--edge);color:var(--steel);font-family:"Share Tech Mono","BIZ UDPGothic",monospace;font-weight:700;line-height:1.25;text-align:center}
.days button small{display:block;font-weight:400;font-size:.7rem;color:var(--sub)}
.days button.on{border-color:var(--accent);color:#fff;background:linear-gradient(180deg,#22C3D0,#00848F)}
.days button.on small{color:#E6FCFF}
.days button.has-todo small{color:var(--ng);font-weight:700}
.days button.on.has-todo small{color:#FFE1DC}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--edge);margin-left:6px}
.tl li{display:flex;justify-content:space-between;border-top:1px dashed var(--edge);padding:7px 0 7px 14px;font-size:.9rem;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;background:var(--plate);border:2px solid var(--edge-hi);transform:rotate(45deg)}
.tl li:first-child{border-top:none}
.tl li.empty{color:var(--sub)}
.tl li:not(.empty)::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 6px rgba(0,200,215,.6)}
.steps li{display:block}
.steps .sh{display:flex;justify-content:space-between}
.steps .chg{font-size:.78rem;color:var(--warn)}
.steps .chg small{margin-left:6px;color:var(--sub)}
.steps .rec{font-size:.84rem;color:var(--ok)}
.steps .rec.cx{color:var(--sub);text-decoration:line-through}
.steps .btn.mini{margin-top:4px}
.kv{display:grid;grid-template-columns:7em 1fr;gap:4px 10px;font-size:.9rem}
.kv dt{color:var(--sub);font-family:"Share Tech Mono","BIZ UDPGothic",monospace;font-size:.8rem}
.kv dd{margin:0;word-break:break-all}
.seg{display:inline-flex;border:1px solid var(--edge-hi);background:#080B0D}
.seg button{min-width:76px;padding:10px 14px;background:transparent;color:var(--sub);font-weight:700}
.seg button+button{border-left:1px solid var(--edge-hi)}
.seg button.on.good{background:var(--ok);color:#06210F;box-shadow:0 0 12px rgba(56,224,138,.5)}
.seg button.on.bad{background:var(--ng);color:#fff;box-shadow:0 0 12px rgba(255,77,61,.5)}
.field{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.field>label{flex:0 0 6.5em;font-size:.82rem;color:var(--sub);font-family:"Share Tech Mono","BIZ UDPGothic",monospace}
.field input[type=number]{width:6em;flex:0 0 auto;text-align:right;font-size:1.15rem;color:var(--cyan)}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{padding:8px 12px;border:1px solid var(--edge-hi);background:#0A0D0F;color:var(--steel)}
.names button.on{border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 10px rgba(56,224,138,.25),0 0 6px rgba(56,224,138,.3)}
.hist{list-style:none;margin:0;padding:0;font-size:.86rem}
.hist li{border-top:1px dashed var(--edge);padding:8px 0}
.hist li.cx{color:var(--sub);text-decoration:line-through}
.link{background:transparent;color:var(--cyan);text-decoration:underline;padding:2px 4px;font-size:.8rem}
.warnbox{border-color:var(--ng);box-shadow:inset 0 0 24px rgba(255,77,61,.08)}
.warnbox h2{color:var(--ng)}
.warnbox h2::before{background:var(--ng);box-shadow:0 0 6px var(--ng)}
.hidden{display:none!important}
.full{position:fixed;inset:0;z-index:10;background:#050708;color:#fff;display:flex;flex-direction:column}
.full .bar{display:flex;gap:8px;padding:12px}
.full .bar .btn{background:#2A3438;color:#fff}
.full .bar .btn.go{background:linear-gradient(180deg,#22C3D0,#00848F);color:#fff}
.full .hint{text-align:center;font-size:.88rem;padding:10px 12px 0;color:var(--cyan);font-family:"Share Tech Mono","BIZ UDPGothic",monospace}
#vfBox{position:relative;flex:1;overflow:hidden}
#vfBox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#guide{position:absolute;left:7%;width:86%;top:50%;transform:translateY(-50%);aspect-ratio:3.2/1;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 14px rgba(0,200,215,.6)}
#guide::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(63,208,255,.6);animation:scan 2s linear infinite}
@keyframes scan{0%{top:6%}50%{top:94%}100%{top:6%}}
#guide::after{content:"1行目：図番　2行目：◇ 年月-号機";position:absolute;left:0;right:0;top:calc(100% + 10px);text-align:center;font-size:.82rem;color:#fff}
#cropStage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
#cropWrap{position:relative;touch-action:none;line-height:0;overflow:hidden}
#cropImg{max-width:100%;max-height:calc(100vh - 220px);display:block;user-select:none;-webkit-user-drag:none}
#cropBox{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:move;touch-action:none}
.h{position:absolute;width:30px;height:30px;background:var(--accent);touch-action:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.h.tl{left:-15px;top:-15px}.h.tr{right:-15px;top:-15px}.h.bl{left:-15px;bottom:-15px}.h.br{right:-15px;bottom:-15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(90px);background:#060909;color:var(--ok);
  border:1px solid var(--ok);box-shadow:0 0 12px rgba(56,224,138,.35);font-family:"Share Tech Mono","BIZ UDPGothic",monospace;padding:10px 16px;transition:transform .25s;z-index:30;font-size:.88rem;max-width:90vw}
#toast:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .25s}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ===== パワーショベル ===== */
:root{--body:#E9EEF0;--body2:#B9C4CA;--dark:#2A3236;--arm:#00A7B5;--glass:#3FD0FF}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.hero{min-height:150px;align-items:stretch}
.hero>div:first-child{position:relative;z-index:1}
.hero .exc{position:absolute;right:4px;bottom:-2px;width:62%;max-width:310px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.exc .trk-tread{animation:tread .8s linear infinite}
@keyframes tread{to{stroke-dashoffset:-16}}
.exc .boom{transform-box:view-box;transform-origin:208px 100px;animation:boom 4s ease-in-out infinite alternate}
.exc .arm{transform-box:view-box;transform-origin:296px 26px;animation:armk 4s ease-in-out infinite alternate}
.exc .bkt{transform-box:view-box;transform-origin:316px 116px;animation:bkt 4s ease-in-out infinite alternate}
@keyframes boom{0%{transform:rotate(-8deg)}100%{transform:rotate(7deg)}}
@keyframes armk{0%{transform:rotate(-22deg)}100%{transform:rotate(14deg)}}
@keyframes bkt{0%{transform:rotate(-35deg)}100%{transform:rotate(40deg)}}
.exc .armpart{fill:url(#gBody);stroke:var(--accent-hi);stroke-width:2;filter:drop-shadow(0 0 5px rgba(63,224,234,.95))}
.exc .dust{animation:dust 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes dust{0%,70%{opacity:0;transform:scale(.4)}100%{opacity:.7;transform:scale(1.2)}}
.tracks{height:16px;margin:0 0 12px;background:
  repeating-linear-gradient(90deg,#3A464D 0 10px,#1A2125 10px 12px,#4C5E69 12px 18px,#1A2125 18px 20px);
  border-top:2px solid #0A0D0F;border-bottom:2px solid #0A0D0F;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -3px 0 rgba(0,0,0,.4);
  animation:tracks 1.2s linear infinite}
@keyframes tracks{to{background-position:20px 0}}
#busy{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at center,#18222A 0%,#070A0C 70%)}
#busy .exc{width:min(86vw,420px)}
#busy .exc .boom,#busy .exc .arm,#busy .exc .bkt,#busy .exc .dust{animation-duration:1.1s}
#busy p{margin:0;font-family:"Orbitron","Share Tech Mono",monospace;letter-spacing:.3em;color:var(--accent-hi);text-shadow:0 0 10px rgba(0,200,215,.6);font-size:1rem}
#busy small{font-family:"Share Tech Mono","BIZ UDPGothic",monospace;color:var(--sub);letter-spacing:.06em}
#busy .ground{width:min(86vw,420px);height:8px;margin-top:-18px;background:repeating-linear-gradient(-45deg,#F5B800 0 10px,#111 10px 20px)}
h1{font-size:1.9rem}
.shoot{min-height:104px;font-size:1.25rem}
.shoot .bucket{display:inline-block;width:34px;height:26px;vertical-align:-5px;margin-right:8px}
</style>
</head>
<body>
<div class="hazard"></div>
<main>
  <header class="hero">
    <div>
      <div class="brand"><span class="led"></span><div><h1>AMING</h1><small>ARM TRACE SYSTEM</small></div></div>
      <button type="button" id="meBtn" data-act="nav" data-v="settings">確認者：未設定</button>
      <div style="margin-top:8px"><span id="today"></span></div>
    </div>
    <div data-exc></div>
  </header>
  <div class="tracks"></div>
  <nav id="nav">
    <button type="button" data-act="nav" data-v="scan" class="on">読取</button>
    <button type="button" data-act="nav" data-v="list">一覧<span id="todoBadge" class="badge hidden"></span></button>
    <button type="button" data-act="nav" data-v="settings">設定</button>
  </nav>

  <div id="scanView">
    <button class="shoot" id="shootBtn" type="button"><svg class="bucket" viewBox="0 0 34 26" fill="none" stroke="#fff" stroke-width="2.6"><path d="M2 8 V2 H9 M25 2 H32 V8 M32 18 V24 H25 M9 24 H2 V18"/><path d="M8 13 H26" stroke-width="1.6" opacity=".9"/></svg>刻印を撮影する<small>枠に図番と号機の2行を合わせる</small></button>
    <button class="shoot alt" id="pickBtn" type="button">写真を選んで枠で切り抜く</button>
    <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
    <input id="pick" type="file" accept="image/*" class="hidden">
    <p class="tip" id="tip">ライトを真横から当てて、打刻の影がはっきり出る角度で撮ると読み取りが安定します。</p>
    <section id="resultSec" class="hidden">
      <h2>読み取り結果</h2>
      <div id="preview"><img id="pv1" alt="切り抜いた刻印"><img id="pv2" alt="凹凸強調"></div>
      <div id="status"></div>
      <div id="readout"></div>
      <div id="cands"></div>
    </section>
    <section>
      <h2>探す</h2>
      <input type="search" id="q" placeholder="図番・号機・建機号機　例: 20269 1152 / YY09066073" autocomplete="off">
      <div id="qres"></div>
    </section>
  </div>

  <div id="listView" class="hidden"></div>
  <div id="armView" class="hidden"></div>
  <div id="settingsView" class="hidden"></div>
</main>

<div class="full hidden" id="vf">
  <div class="hint">枠いっぱいに刻印を合わせて「撮る」</div>
  <div id="vfBox"><video id="video" playsinline muted autoplay></video><div id="guide"></div></div>
  <div class="bar"><button class="btn" id="vfCancel" type="button">やめる</button><button class="btn go" id="vfShot" type="button">撮る</button></div>
</div>
<div class="full hidden" id="crop">
  <div class="hint">枠を刻印の2行に合わせる（ドラッグで移動、角で大きさ）</div>
  <div id="cropStage"><div id="cropWrap"><img id="cropImg" alt="切り抜く写真"><div id="cropBox"><div class="h tl" data-h="tl"></div><div class="h tr" data-h="tr"></div><div class="h bl" data-h="bl"></div><div class="h br" data-h="br"></div></div></div></div>
  <div class="bar"><button class="btn" id="cropCancel" type="button">やめる</button><button class="btn go" id="cropOk" type="button">この範囲で読む</button></div>
</div>
<div id="busy" class="hidden"><div data-exc></div><div class="ground"></div><p id="busyT">READING</p><small id="busyS"></small></div>
<div id="toast"></div>

<script>

function toBlob(c, q) { return new Promise(r => c.toBlob(r, "image/jpeg", q || 0.9)); }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

// 切り抜いた canvas → 送信用2枚（元・凹凸強調）
async function prepare(cv) {
  const target = 1400, sc = Math.min(2.5, target / cv.width);
  const w = Math.round(cv.width * sc), h = Math.round(cv.height * sc);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(cv, 0, 0, w, h);
  const orig = await toBlob(c);
  const src = x.getImageData(0, 0, w, h);
  const b = document.createElement("canvas"); b.width = w; b.height = h;
  const bx = b.getContext("2d"); bx.filter = `blur(${Math.max(8, Math.round(h / 25))}px) grayscale(1)`; bx.drawImage(c, 0, 0);
  const bl = bx.getImageData(0, 0, w, h).data, s = src.data, diff = new Float32Array(w * h), vals = [];
  for (let i = 0, p = 0; i < s.length; i += 4, p++) { const v = (0.299 * s[i] + 0.587 * s[i+1] + 0.114 * s[i+2]) - bl[i]; diff[p] = v; if (p % 7 === 0) vals.push(v); }
  vals.sort((a, b) => a - b);
  const lo = vals[Math.floor(vals.length * 0.01)], hi = vals[Math.floor(vals.length * 0.99)], k = 255 / ((hi - lo) || 1);
  for (let i = 0, p = 0; i < s.length; i += 4, p++) { const v = Math.max(0, Math.min(255, (diff[p] - lo) * k)); s[i] = s[i+1] = s[i+2] = v; }
  x.putImageData(src, 0, 0);
  return {orig, enh: await toBlob(c)};
}

/* ---------- ファインダー（枠つきカメラ） ---------- */
let stream = null;
async function openViewfinder() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camNote("このブラウザはカメラの直接起動に対応していません"); return false; }
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 3840}, height: {ideal: 2160}}, audio: false}); }
  catch (e) { camNote(e && e.name === "NotAllowedError" ? "カメラの使用が許可されていません" : "カメラを起動できませんでした"); return false; }
  const v = $("video"); v.srcObject = stream; $("vf").classList.remove("hidden");
  try { await v.play(); } catch (e) {}
  return true;
}
function camNote(m) { $("tip").textContent = "⚠ " + m + "。普通に撮ってから枠で切り抜きます。"; }
function closeViewfinder() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $("vf").classList.add("hidden"); }
function shotFromViewfinder() {
  const v = $("video"), box = $("vfBox").getBoundingClientRect(), g = $("guide").getBoundingClientRect();
  const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return null;
  const scale = Math.max(box.width / vw, box.height / vh);
  const ox = (box.width - vw * scale) / 2, oy = (box.height - vh * scale) / 2;
  const mx = g.width * 0.06, my = g.height * 0.12;
  let sx = (g.left - box.left - mx - ox) / scale, sy = (g.top - box.top - my - oy) / scale;
  let sw = (g.width + mx * 2) / scale, sh = (g.height + my * 2) / scale;
  sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
  const c = document.createElement("canvas"); c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

      const W = ci.clientWidth, H = ci.clientHeight;
      if (!W || !H) { setTimeout(place, 50); return; }
      const w = W * 0.8, h = Math.max(60, Math.min(H * 0.6, w / 3.2));
      rect = {x: (W - w) / 2, y: Math.max(0, (H - h) / 2), w, h}; drawRect();
    };
    ci.onload = () => requestAnimationFrame(place);
    ci.src = img.src;
    if (ci.complete && ci.naturalWidth) requestAnimationFrame(place);
  });
}
function drawRect() { const b = $("cropBox").style; b.left = rect.x + "px"; b.top = rect.y + "px"; b.width = rect.w + "px"; b.height = rect.h + "px"; }
$("cropBox").addEventListener("pointerdown", e => { e.preventDefault(); $("cropBox").setPointerCapture(e.pointerId); drag = {mode: e.target.dataset.h || "move", sx: e.clientX, sy: e.clientY, r: {...rect}}; });
$("cropBox").addEventListener("pointermove", e => {
  if (!drag) return;
  const W = $("cropImg").clientWidth, H = $("cropImg").clientHeight, dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, r = {...drag.r}, MIN = 40;
  if (drag.mode === "move") { r.x = Math.min(Math.max(0, r.x + dx), W - r.w); r.y = Math.min(Math.max(0, r.y + dy), H - r.h); }
  else {
    if (drag.mode.includes("l")) { const nx = Math.min(Math.max(0, r.x + dx), r.x + r.w - MIN); r.w += r.x - nx; r.x = nx; }
    if (drag.mode.includes("r")) r.w = Math.min(Math.max(MIN, r.w + dx), W - r.x);
    if (drag.mode.includes("t")) { const ny = Math.min(Math.max(0, r.y + dy), r.y + r.h - MIN); r.h += r.y - ny; r.y = ny; }
    if (drag.mode.includes("b")) r.h = Math.min(Math.max(MIN, r.h + dy), H - r.y);
  }
  rect = r; drawRect();
});
["pointerup", "pointercancel"].forEach(ev => $("cropBox").addEventListener(ev, () => drag = null));
$("cropCancel").onclick = () => { $("crop").classList.add("hidden"); cropResolve && cropResolve(null); };
$("cropOk").onclick = () => {
  const k = cropNat.naturalWidth / $("cropImg").clientWidth;
  const c = document.createElement("canvas"); c.width = Math.round(rect.w * k); c.height = Math.round(rect.h * k);
  c.getContext("2d").drawImage(cropNat, rect.x * k, rect.y * k, rect.w * k, rect.h * k, 0, 0, c.width, c.height);
  $("crop").classList.add("hidden"); cropResolve && cropResolve(c);
};
async function cropFromFile(file) {
  try { return await openCrop(await loadImg(URL.createObjectURL(file))); }
  catch (e) { toast("写真を開けませんでした"); return null; }
}

/* ================= 読み取り ================= */
function setBusy(b) { ["shootBtn", "pickBtn"].forEach(id => $(id).disabled = b); }
async function readCanvas(cv) {
  $("resultSec").classList.remove("hidden");
  $("cands").innerHTML = ""; $("readout").innerHTML = "";
  $("status").textContent = "画像を準備中…";
  const imgs = await prepare(cv);
  $("pv1").src = URL.createObjectURL(imgs.orig); $("pv2").src = URL.createObjectURL(imgs.enh);
  $("preview").style.display = "flex";
  $("resultSec").scrollIntoView({behavior: "smooth", block: "start"});
  setBusy(true);
  $("status").textContent = "刻印を読み取り中…（10〜30秒）";
  busy(true, "READING", "刻印を読み取り中…（10〜30秒）");
  try {
    const r = await run("apiRead", await b64(imgs.orig), await b64(imgs.enh), lastArm);
    photoId = r.photoId || "";
    $("status").textContent = "";
    const z = r.read.zuban.split("").map((c, i) => r.read.fixed.includes(i) ? `<span class="fix">${esc(c)}</span>` : esc(c)).join("") || "????";
    $("readout").innerHTML = `<div class="plate">${z}<br>◇${esc(r.read.seizo || "????")}-${esc(r.read.goki || "?")} ${esc(r.read.kensa || "")}</div>`;
    const p = r.pick;
    if (p && p.index >= 0 && r.sure) { toast("一致：" + r.cands[0].z + " " + r.cands[0].g + "号機"); openArm(r.cands[0].key, true); return; }
    let head = "";
    if (p && p.index >= 0) head = `<p>AIの判定：<b>${"ABCDE"[p.index]}</b>（確信度 ${esc(p.confidence)}）${esc(p.reason || "")}</p>`;
    else if (p) head = `<p>候補に一致するものがない、とAIは判定しました。${esc(p.reason || "")}</p>`;
    $("cands").innerHTML = head + '<p class="muted">タップして記録画面を開く</p>' + r.cands.map((a, i) =>
      armBtn(a, (a.seq ? '<span class="chip">前回の続き番号</span>' : ""), p && p.index === i ? "best" : "").replace('class="az">', `class="az">${"ABCDE"[i]}: `)).join("");
  } catch (e) {
    $("status").textContent = "読み取れませんでした：" + errMsg(e) + "　下の「探す」で手入力もできます。";
  } finally { setBusy(false); busy(false); }
}

/* ================= 検索 ================= */
let qTimer = null;
$("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  const q = $("q").value.trim();
  if (!q) { $("qres").innerHTML = ""; return; }
  qTimer = setTimeout(async () => {
    $("qres").innerHTML = '<p class="muted">検索中…</p>';
    try {
      const rows = await run("apiSearch", q);
      if ($("q").value.trim() !== q) return;
      $("qres").innerHTML = rows.length ? rows.map(a => armBtn(a)).join("") : '<p class="muted">見つかりません</p>';
    } catch (e) { $("qres").innerHTML = `<p class="muted">${esc(errMsg(e))}</p>`; }
  }, 400);
});

/* ================= イベント ================= */
$("shootBtn").onclick = async () => { if (!(await openViewfinder())) $("cam").click(); };
$("pickBtn").onclick = () => $("pick").click();
$("vfCancel").onclick = closeViewfinder;
$("vfShot").onclick = () => { const c = shotFromViewfinder(); closeViewfinder(); if (c) readCanvas(c); };
["cam", "pick"].forEach(id => $(id).onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return; const c = await cropFromFile(f); if (c) readCanvas(c); });

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "nav") show(b.dataset.v);
  else if (act === "day") { day = b.dataset.d; renderList(); }
  else if (act === "arm") openArm(b.dataset.k);
  else if (act === "back") show(day ? "list" : "scan");
  else if (act === "res") { form.result = b.dataset.v; syncForm(); }
  else if (act === "person") { form.person = b.dataset.n; syncForm(); }
  else if (act === "allok") {
    readForm();
    if (!form.holes) { $("formMsg").textContent = "ねじ穴数を入れてください（次からは自動で入ります）"; $("fHoles").focus(); return; }
    saveTap({result: "良", holes: form.holes, treated: form.holes, person: form.person, note: form.note});
  }
  else if (act === "save") { readForm(); saveTap({result: form.result, holes: form.holes, treated: form.treated, person: form.person, note: form.note}); }
  else if (act === "step") {
    if (!me) { toast("設定タブで自分の名前を選んでください"); return; }
    const note = prompt(`${b.dataset.s}を記録します（${me}）。メモがあれば入力`, "");
    if (note === null) return;
    b.disabled = true;
    try { armData = await run("apiSaveStep", {key: armData.key, step: b.dataset.s, person: me, note, photoId}); toast(b.dataset.s + "を記録しました"); renderArm(); }
    catch (err) { toast(errMsg(err)); b.disabled = false; }
  }
  else if (act === "cancelStep") {
    if (!confirm("この工程記録を取り消しますか？（記録は残り、取消線が付きます）")) return;
    try { armData = await run("apiCancelStep", b.dataset.id, armData.key); renderArm(); } catch (err) { toast(errMsg(err)); }
  }
  else if (act === "cancel") {
    if (!confirm("この記録を取り消しますか？（記録は残り、取消線が付きます）")) return;
    try { armData = await run("apiCancelTap", b.dataset.id, armData.key); renderArm(); refreshDays(); } catch (err) { toast(errMsg(err)); }
  }
  else if (act === "me") { me = b.dataset.n; ls.set("trace.me", me); renderHead(); renderSettings(); }
  else if (act === "csv") {
    try {
      const csv = await run("apiCsv", $("csvFrom").value.trim(), $("csvTo").value.trim());
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
      a.download = "タップ記録_" + boot.today.replace(/\//g, "") + ".csv"; a.click();
    } catch (err) { toast(errMsg(err)); }
  }
});

run("apiBoot").then(b => { boot = b; renderHead(); }).catch(e => toast("起動エラー：" + errMsg(e)));
renderHead();
})();
</script>
