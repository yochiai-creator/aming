<body>
<main>
  <header>
    <div><h1 id="ttl">アーム塗装後確認</h1><button type="button" id="meBtn" data-act="me">自分の名前を設定</button></div>
    <div id="mstat">明細を読み込み中…</div>
  </header>
  <nav id="nav"><button type="button" data-act="nav" data-v="scan" class="on">読取</button><button type="button" data-act="nav" data-v="list">一覧</button><button type="button" data-act="nav" data-v="settings">設定</button></nav>

  <div id="scanView">
  <button class="shoot" id="shootBtn" type="button">刻印を撮影する<small>黄色い枠に図番と号機の2行を合わせる</small></button>
  <button class="shoot alt" id="pickBtn" type="button">写真を選んで枠で切り抜く</button>
  <button class="shoot alt hidden" id="demoBtn" type="button">サンプル写真で試す<small>実際の刻印写真（YN12B20269F1 1152号機）</small></button>
  <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
  <input id="pick" type="file" accept="image/*" class="hidden">
  <p class="tip" id="tip">刻印を読み取ると、そのアームの塗装後確認が開きます。ライトを真横から当てて、打刻の影がはっきり出る角度で撮ると読み取りが安定します。</p>

  <section id="resultSec" class="hidden">
    <h2>読み取り結果</h2>
    <div id="preview"><img id="pv1" alt="切り抜いた刻印"><img id="pv2" alt="凹凸強調"></div>
    <div id="status"></div>
    <div id="readout"></div>
    <div id="cands"></div>
  </section>

  <section>
    <h2>手入力で探す</h2>
    <input type="text" id="q" placeholder="例: 20269 1152 / LS12B10010 39" autocomplete="off">
    <div id="qres"></div>
  </section>

  <section>
    <details>
      <summary>出荷明細を取り込む</summary>
      <p class="muted">「アーム出荷明細」PDFを選ぶと、図番・号機・出荷日・出荷先を取り込みます。今の明細は置き換わります（入力済みの記録は消えません）。</p>
      <input type="file" id="pdfIn" accept="application/pdf">
      <p class="muted" style="margin-top:12px">PDFが読めないときは、明細の文字をコピーしてここに貼り付けてください。</p>
      <textarea id="pasteIn" placeholder="明細のテキスト"></textarea>
      <div class="row"><button class="btn" id="pasteBtn" type="button">貼り付けた内容を取り込む</button></div>
      <div id="impStat" class="muted"></div>
    </details>
  </section>
  </div>

  <div id="view" class="hidden"></div>
</main>

<div class="full hidden" id="vf">
  <div class="hint">枠いっぱいに刻印を合わせて「撮る」</div>
  <div id="vfBox"><video id="video" playsinline muted autoplay></video><div id="guide"></div></div>
  <div class="bar"><button class="btn" id="vfCancel" type="button">やめる</button><button class="btn go" id="vfShot" type="button">撮る</button></div>
</div>
<div class="full hidden" id="crop">
  <div class="hint">黄色い枠を刻印の2行に合わせる（ドラッグで移動、角で大きさ）</div>
  <div id="cropStage"><div id="cropWrap"><img id="cropImg" alt="切り抜く写真"><div id="cropBox"><div class="h tl" data-h="tl"></div><div class="h tr" data-h="tr"></div><div class="h bl" data-h="bl"></div><div class="h br" data-h="br"></div></div></div></div>
  <div class="bar"><button class="btn" id="cropCancel" type="button">やめる</button><button class="btn go" id="cropOk" type="button">この範囲で読む</button></div>
</div>
<div id="modal" class="hidden"><div id="modalBody"></div></div>
<div id="toast"></div>

<script>
const DEMO = false;
const DEMO_ROWS = null;
const DEMO_IMG = null;

<script>
(() => {
const $ = id => document.getElementById(id);
let db = null, sample = null, myId = null;
let master = [];
let scans = [];
/* ================= 照合ロジック ================= */
const SIM = [["0","O","D","Q"],["1","I","L","7","T"],["2","Z"],["5","S","6"],["8","B","3"],["9","7","4"],["6","G","5"],["F","E","P"],["N","M"],["U","V"]];
const simMap = {};
SIM.forEach(g => g.forEach(a => g.forEach(b => { if (a !== b) simMap[a + b] = 1; })));
function subCost(a, b) { if (a === b) return 0; if (a === "?" || b === "?") return 0.25; return simMap[a + b] ? 0.35 : 1; }
function wdist(a, b) {
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + subCost(a[i-1], b[j-1]));
  return d[m][n];
}
function norm(s) { return String(s || "").toUpperCase().replace(/[ØΦθ∅]/g, "0").replace(/[^A-Z0-9?]/g, ""); }

// 桁ごとの型で補正：英2・数2・B・数5・F・数1（+G数1）
const TO_DIGIT = {O:"0",D:"0",Q:"0",I:"1",L:"1",T:"1",Z:"2",S:"5",B:"8",G:"6",A:"4"};
const TO_ALPHA = {"0":"O","1":"I","2":"Z","5":"S","8":"B","6":"G","4":"A"};
function fitZuban(raw) {
  const z = norm(raw);
  const tpl = z.length === 14 ? "AANNBNNNNNFNGN" : z.length === 12 ? "AANNBNNNNNFN" : null;
  if (!tpl) return {z, fixed: []};
  let out = "", fixed = [];
  for (let i = 0; i < z.length; i++) {
    let c = z[i], t = tpl[i], n = c;
    if (c === "?") n = c;
    else if (t === "N" && !/\d/.test(c)) n = TO_DIGIT[c] || c;
    else if (t === "A" && /\d/.test(c)) n = TO_ALPHA[c] || c;
    else if (t === "B" || t === "F" || t === "G") n = t;
    if (n !== c) fixed.push(i);
    out += n;
  }
  return {z: out, fixed};
}
function fitGoki(raw) { return norm(raw).split("").map(c => /\d|\?/.test(c) ? c : (TO_DIGIT[c] || "")).join(""); }

function rank(z, g) {
  const last = scans[0];
  return master.map(r => {
    const cz = z ? wdist(z, r.z) : 3;
    const cg = g ? wdist(g, r.g) * 1.5 : 2;
    let cost = cz + cg, seq = false;
    // 号機の並び：直前の記録と同じ図番で、すぐ後の号機なら優先
    if (last && last.z === r.z && /^\d+$/.test(r.g) && /^\d+$/.test(last.g)) {
      const dg = +r.g - +last.g;
      if (dg >= 1 && dg <= 5) { cost = Math.max(0, cost - 0.3); seq = true; }
    }
    if (scans.some(s => s.z === r.z && s.g === r.g)) cost += 0.5;
    return {r, cost, seq};
  }).sort((a, b) => a.cost - b.cost);
}

/* ================= 明細PDF ================= */
function parseMaster(text) {
  const re = /([A-Z]{2}\d{2}B\d{5}F\d(?:G\d)?)\s+(\d{1,4})(?=\s)/g;
  const hits = []; let m;
  while ((m = re.exec(text))) hits.push({z: m[1], g: m[2], s: m.index, e: re.lastIndex});
  const out = [], seen = new Set();
  hits.forEach((h, i) => {
    const seg = text.slice(h.e, i + 1 < hits.length ? hits[i+1].s : h.e + 200);
    const dm = /(\d{1,2})月(\d{1,2})日/.exec(seg); if (!dm) return;
    const sp = seg.slice(0, dm.index).replace(/\s+/g, " ").trim();
    const rest = seg.slice(dm.index + dm[0].length).replace(/^\s*\(旧[^)]*\)\s*/, "");
    const to = (rest.match(/^\s*(\S+)/) || [])[1] || "";

async function prepare(cv) {
  const target = 1400, sc = Math.min(2.5, target / cv.width);
  const w = Math.round(cv.width * sc), h = Math.round(cv.height * sc);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(cv, 0, 0, w, h);
  const orig = await toBlob(c);
  const src = x.getImageData(0, 0, w, h);
  const b = document.createElement("canvas"); b.width = w; b.height = h;
  const bx = b.getContext("2d"); bx.filter = `blur(${Math.max(8, Math.round(h / 25))}px) grayscale(1)`; bx.drawImage(c, 0, 0);
  const bl = bx.getImageData(0, 0, w, h).data, s = src.data, diff = new Float32Array(w * h);
  const vals = [];

    const v = (0.299 * s[i] + 0.587 * s[i+1] + 0.114 * s[i+2]) - bl[i]; diff[p] = v; if (p % 7 === 0) vals.push(v);
  }
  vals.sort((a, b) => a - b);
  const lo = vals[Math.floor(vals.length * 0.01)], hi = vals[Math.floor(vals.length * 0.99)], k = 255 / ((hi - lo) || 1);
  for (let i = 0, p = 0; i < s.length; i += 4, p++) { const v = Math.max(0, Math.min(255, (diff[p] - lo) * k)); s[i] = s[i+1] = s[i+2] = v; }
  x.putImageData(src, 0, 0);

}

  h += rows.map(r => {
    const a = docs[armId(r.z, r.g)] || {}, p = paintStat(a);
    const pcls = p.issues && !p.fixed ? "bad" : p.filled ? "good" : (a.paint ? "mid" : "");

}

/* ================= 刻印読取 → アームを開く ================= */
function showCands(top, r2, sure, r1, fz, g) {
  let order = top.slice(), v, cls, note = "";
  const idx = r2 && typeof r2.choice === "string" ? "ABCDE".indexOf(r2.choice.trim().toUpperCase()) : -1;
  if (sure) { v = "明細と一致"; cls = "v-ok"; }
  else if (idx >= 0 && idx < top.length) {
    const chosen = top[idx]; order = [chosen, ...top.filter((_, i) => i !== idx)];
    if (String(r2.confidence || "").includes("高")) { v = idx === 0 ? "明細と一致（2段階で確認）" : "2回目の確認で特定"; cls = "v-ok"; }
    else { v = "候補あり・確認してください"; cls = "v-warn"; }
    if (r2.reason) note = `<div class="muted">確認メモ: ${esc(r2.reason)}</div>`;
  } else if (r2 && r2.choice === "none") { v = "明細に一致するものがありません"; cls = "v-ng"; }
  else if (top[0].cost <= 0.6) { v = "候補あり・確認してください"; cls = "v-warn"; }
  else { v = "明細に見当たりません"; cls = "v-ng"; }
  let h = `<span class="verdict ${cls}">${v}</span>${note}`;
  order.slice(0, 3).forEach((s, i) => { h += candHtml(s.r, i === 0 && cls !== "v-ng", s.seq); });
  h += rawBtn();
  $("cands").innerHTML = h; lastRead = r1;
  bindRaw(r1, fz, g);
}
let lastRead = null;
function candHtml(row, best, seq) {
  const a = docs[armId(row.z, row.g)], dup = a && a.scan;
  return `<button type="button" class="cand${best ? " best" : ""}" data-act="pickCand" data-z="${esc(row.z)}" data-g="${esc(row.g)}">
    <b>${esc(row.z)}　${esc(row.g)}号機</b>${seq ? '<span class="chip">前回の続き番号</span>' : ""}
    <div class="meta">${esc(row.d)} 出荷 ／ ${esc(row.to)} ／ ${esc(row.sp)}</div>
    ${dup ? `<div class="dup">刻印読取済み（${esc(dup.by || "")} ${fmtAt(dup.at)}）</div>` : ""}
    <div class="meta">タップでこのアームの塗装後確認を開く</div></button>`;
}
function rawBtn() { return `<div class="row"><button type="button" class="btn sec" id="recRaw">読み取りどおり「明細外」で開く</button></div>`; }
function bindRaw(r1, fz, g) { const b = $("recRaw"); if (b) b.onclick = () => openFromScan({z: fz.z, g, d: "", to: "明細外", sp: ""}, r1); }
document.addEventListener("click", e => {
  const b = e.target.closest('[data-act="pickCand"]'); if (!b) return;
  const row = master.find(x => x.z === b.dataset.z && x.g === b.dataset.g);
  openFromScan(row, b.closest("#qres") ? null : lastRead);
});
function openFromScan(row, r) {
  const id = ensureArm(row);
  const o = {};
  if (r) {
    o.scan = {z: row.z, g: row.g, seizo: norm(r.seizo), kensa: norm(r.kensa), raw: `${r.zuban || ""} / ${r.seizo || ""}-${r.goki || ""} ${r.kensa || ""}`, at: Date.now(), by: me || ""};
  }
  if (Object.keys(o).length) patch(id, o);
  curArm = id; view = "arm"; armTab = "mfg";
  $("cands").innerHTML = ""; $("resultSec").classList.add("hidden");
  render(); window.scrollTo(0, 0);
}
function renderMstat(src) { $("mstat").textContent = master.length ? `照合対象 ${master.length}件` + (src ? `\n${src}` : "") : "出荷明細が未登録です"; if (view !== "scan") render(); }

$("q").addEventListener("input", () => {
  const parts = $("q").value.trim().split(/\s+/).filter(Boolean);
  if (!parts.length || !master.length) { $("qres").innerHTML = ""; return; }
  const [a, b] = parts;
  const hits = master.filter(r => r.z.includes(norm(a)) && (!b || r.g === norm(b) || r.g.startsWith(norm(b))) || (parts.length === 1 && r.g === norm(a))).slice(0, 8);
  $("qres").innerHTML = hits.length ? hits.map(r => candHtml(r, false, false)).join("") : '<p class="muted">該当なし</p>';
});

/* ================= CSV ================= */
async function exportCsv() {
  if (!curDay) curDay = defaultDay();
  const rows = rowsOfDay(curDay), q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["出荷日","図番","号機","出荷先","仕様","刻印","刻印読取者","刻印読取日時"];
  PAINT_YN.forEach(([, l]) => head.push(l)); head.push("ねじ穴タップ","処置数","ねじ穴数","タッチアップ確認","修正確認","修正者","色","測定者", ...FILM.map(([, l]) => "膜厚" + l));
  const lines = [head.map(q).join(",")];
  rows.forEach(r => {
    const a = docs[armId(r.z, r.g)] || {}, sc = a.scan || {}, p = a.paint || {}, c = [curDay, r.z, r.g, r.to, r.sp, sc.z ? `${sc.z} ${sc.seizo}-${sc.g} ${sc.kensa}` : "", sc.by, fmtAt(sc.at)];
    PAINT_YN.forEach(([k]) => c.push(p[k] || "")); c.push(p.tap || "", p.holesDone || "", p.holes || "", p.touchup ? p.touchup.name : "", p.fixcheck ? p.fixcheck.name : "", p.fixer || "", p.color || "", p.measurer || "", ...FILM.map(([k]) => getPath(p, "film." + k) || ""));
    lines.push(c.map(q).join(","));
  });
  const ds = docs[dayId(curDay)] || {};
  lines.push("", q("出荷日承認"));
  DAY_SIGNS.forEach(([k, l]) => { const sg = getPath(ds, "signs." + k) || {}; lines.push([l, sg.name || "", fmtAt(sg.at)].map(q).join(",")); });
  const data = "\uFEFF" + lines.join("\r\n"), fn = `塗装後確認_${curDay.replace("/", "月")}日出荷.csv`;
  const dl = window.claude && claude.use ? await claude.use("downloads").catch(() => null) : null;
  if (!dl) { toast("この画面ではファイルを保存できません"); return; }
  try { await dl.save({filename: fn, data}); } catch (e) { if (e && e.code !== "declined") toast("保存できませんでした"); }
}

  db.doc("master/current").onSnapshot(s => { if (s.exists) { const d = s.data(); master = d.rows || []; renderMstat(d.source); } else renderMstat(); }, () => {});
  db.collection("arms").onSnapshot(q => { q.docs.forEach(d => { docs["arms/" + d.id] = d.data(); }); render(); }, () => {});
  db.collection("days").onSnapshot(q => { q.docs.forEach(d => { docs["days/" + d.id] = d.data(); }); render(); }, () => {});
  db.collection("settings").onSnapshot(q => { q.docs.forEach(d => { docs["settings/" + d.id] = d.data(); }); people = (docs["settings/people"] || {}).names || []; film = docs["settings/film"] || {}; render(); }, () => {});
})();
})();
</script>
